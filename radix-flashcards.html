<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radix Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred study column; ruled index-card faces that flip in 3D; one amber LED per card shows mastery */
:root{
  --bg:#E8ECF1; --panel:#FFFFFF; --panel2:#F6F3EC; --ink:#142235; --muted:#566377; --line:#D0D8E2; --rule:rgba(11,122,134,.10);
  --cell:#F8FAFC; --led:#F2A31B; --led-ink:#2A1900; --led-glow:rgba(242,163,27,.42); --led-dim:#F6D9A4;
  --sig:#D1495B; --carry:#0B7A86; --ok:#1B7A4A; --warn:#A86200; --bad:#C0392B; --focus:#2F6FE0; --shadow:rgba(20,34,53,.35);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --panel:#151E29; --panel2:#1C2530; --ink:#E5ECF4; --muted:#95A2B4; --line:#2A3748; --rule:rgba(69,201,214,.08);
  --cell:#18222E; --led:#FFB22E; --led-ink:#231400; --led-glow:rgba(255,178,46,.45); --led-dim:#5A4318;
  --sig:#FF7A8A; --carry:#45C9D6; --ok:#58D58E; --warn:#F2B04A; --bad:#FF7B6E; --focus:#7FA8FF; --shadow:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --panel:#151E29; --panel2:#1C2530; --ink:#E5ECF4; --muted:#95A2B4; --line:#2A3748; --rule:rgba(69,201,214,.08);
  --cell:#18222E; --led:#FFB22E; --led-ink:#231400; --led-glow:rgba(255,178,46,.45); --led-dim:#5A4318;
  --sig:#FF7A8A; --carry:#45C9D6; --ok:#58D58E; --warn:#F2B04A; --bad:#FF7B6E; --focus:#7FA8FF; --shadow:rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.app{max-width:820px;margin-inline:auto;padding-inline:20px;padding-block:22px 48px}
@media (max-width:520px){.app{padding-inline:16px}}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
button{font:inherit}

.hd{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font:700 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.14em;color:var(--carry);margin:0 0 .3rem}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1;letter-spacing:-.02em;margin:0}
h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem;margin:0 0 .8rem;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:1.4rem 0 .5rem}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.greet{color:var(--muted);margin:0 0 1rem}

/* deck picker */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.deck{position:relative;display:block;cursor:pointer}
.deck input{position:absolute;opacity:0;pointer-events:none}
.tile{display:grid;gap:8px;height:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);transition:border-color .2s,box-shadow .2s}
.deck:hover .tile{border-color:var(--muted)}
.deck input:checked+.tile{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.deck input:focus-visible+.tile{outline:2.5px solid var(--focus);outline-offset:2px}
.tile-h{display:flex;align-items:center;gap:8px}
.tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:transparent;flex:none}
.deck input:checked+.tile .tick{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tile-n{font-weight:700}
.tile-c{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip i{width:9px;height:9px;border-radius:2px;background:var(--cell);border:1px solid var(--line)}
.strip i.b1{background:var(--bad);border-color:var(--bad);opacity:.55}
.strip i.b2{background:var(--led-dim);border-color:var(--led-dim)}
.strip i.b3{background:var(--led);border-color:var(--led);box-shadow:0 0 5px var(--led-glow)}
.tile-s{font-size:.75rem;color:var(--muted)}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opt input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:none}
.opt small{display:block;color:var(--muted);font-size:.82rem}
.opt select{font:inherit;color:var(--ink);background:var(--cell);border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;margin-left:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);font-weight:700;padding:10px 18px;border-radius:11px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.link{appearance:none;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px;font-size:.88rem}
.link.warn{color:var(--bad);font-weight:700}
.keys{margin-top:22px;color:var(--muted);font-size:.85rem}
kbd{font:700 .75rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel);color:var(--ink)}

/* study */
.topbar{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prog{flex:1;display:grid;gap:4px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--led);border-radius:99px;transition:width .4s}
.ptxt{font:500 .78rem var(--f-mono);color:var(--muted)}
.stage{perspective:1600px}
.card{cursor:pointer;border-radius:18px}
.card:focus{outline:none}
.card:focus-visible{outline:2.5px solid var(--focus);outline-offset:4px}
.inner{display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.75,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background-color:var(--panel);padding:20px 24px 18px;min-height:320px;display:flex;flex-direction:column;gap:14px;box-shadow:0 22px 44px -28px var(--shadow);min-width:0}
@media (max-width:520px){.face{padding:16px;min-height:300px}}
.front{background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 2.1rem;background-position:0 3.4rem}
.back{transform:rotateY(180deg);background-color:var(--panel2)}
.instant .inner{transition:none}
.card.enter .inner{animation:enter .38s ease}
@keyframes enter{from{opacity:0;transform:translateX(28px) rotate(1.5deg)}}
.fhead{display:flex;align-items:center;gap:10px;font:700 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.fhead .num{margin-left:auto;font-family:var(--f-mono);letter-spacing:0}
.tag.ans{color:var(--carry)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(1.2rem,3.4vw,1.6rem);line-height:1.3;margin:auto 0;text-wrap:balance}
.a{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3.8vw,1.85rem);line-height:1.2;text-wrap:balance}
.x{margin:0;color:var(--muted);max-width:62ch}
.vis{overflow-x:auto;max-width:100%}
.cue{margin-top:auto;font-size:.8rem;color:var(--muted);text-align:right}
.verdict{margin-left:auto;font:700 .75rem var(--f-body);letter-spacing:.04em;text-transform:none;padding:3px 9px;border-radius:99px}
.verdict.ok{color:var(--ok);border:1.5px solid var(--ok)}
.verdict.no{color:var(--bad);border:1.5px solid var(--bad)}
.typ{display:flex;gap:8px;flex-wrap:wrap}
.typ input{flex:1 1 180px;min-width:0;font:600 1.1rem var(--f-mono);color:var(--ink);background:var(--cell);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.typ input:focus{border-color:var(--focus);outline:none}
.bits{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:nowrap}
.bt{font-style:normal;width:1.55rem;height:1.85rem;display:inline-grid;place-items:center;border:1.5px solid var(--line);border-radius:5px;background:var(--cell);font:700 .88rem var(--f-mono);color:var(--muted);flex:none}
.bt.on{background:var(--led);border-color:var(--led);color:var(--led-ink);box-shadow:0 0 8px var(--led-glow)}
.bt.sg{box-shadow:inset 0 -3px 0 var(--sig)}
.bt.on.sg{box-shadow:inset 0 -3px 0 var(--sig),0 0 8px var(--led-glow)}
.bits .gap{width:7px;flex:none}
.calc{font:500 .92rem/1.55 var(--f-mono);margin:0;padding:10px 14px;background:var(--cell);border:1px solid var(--line);border-radius:10px;width:max-content;max-width:100%;overflow-x:auto;color:var(--ink)}
.rows{display:grid;grid-template-columns:auto auto;gap:8px 14px;align-items:center;width:max-content;font-size:.88rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rb{appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 8px;cursor:pointer;display:grid;gap:1px;justify-items:center;font-weight:700;transition:transform .15s,border-color .2s,background .2s}
.rb small{font-weight:400;font-size:.74rem;color:var(--muted)}
.rb kbd{margin-top:3px}
.rb:disabled{opacity:.38;cursor:not-allowed}
.rb:not(:disabled):hover{transform:translateY(-2px)}
.rb.r1{border-color:var(--bad)} .rb.r1 span{color:var(--bad)}
.rb.r2{border-color:var(--warn)} .rb.r2 span{color:var(--warn)}
.rb.r3{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.rb.r3 small{color:var(--panel);opacity:.85}
.rb.suggest{box-shadow:0 0 0 3px var(--focus)}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:.9rem 0 0}

/* done */
.done{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 24px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin:.2rem 0 .4rem;font-variant-numeric:tabular-nums}
.big small{font-size:.32em;color:var(--muted);font-weight:600;margin-left:.3em}
.sumtxt{color:var(--muted);margin:0 0 1rem}
.miss{list-style:none;padding:0;margin:0 0 1.2rem;display:grid;gap:6px}
.miss li{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:.92rem}
.miss li b{font:700 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--carry);display:block}
@media (prefers-reduced-motion: reduce){.inner,.bar i,.rb,.tile{transition:none!important}.card.enter .inner{animation:none}}
</style>
</head>
<body>


<div class="app">
  <header class="hd">
    <div><p class="eyebrow">Digital logic design · Number systems</p><h1>Radix Flashcards</h1></div>
    <span class="pill" id="lmsPill"><i></i><span>Standalone</span></span>
  </header>

  <section id="vSetup">
    <p class="greet" id="greet"></p>
    <h2>Choose what to study</h2>
    <div class="decks" id="deckList"></div>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="optDrill" checked><span>Add 8 practice drills<small>Fresh numbers every session, each with a worked solution.</small></span></label>
      <label class="opt"><input type="checkbox" id="optType"><span>Type my answer before flipping<small>On cards with a numeric answer, check what you type.</small></span></label>
      <label class="opt" style="align-items:center"><span>Card order<select id="optOrder"><option value="weak">Weakest first</option><option value="shuffle">Shuffled</option><option value="deck">In deck order</option></select></span></label>
    </div>
    <div class="row">
      <button type="button" class="btn" id="btnStart">Start studying</button>
      <button type="button" class="btn ghost" id="btnResume" hidden>Resume session</button>
      <button type="button" class="link" id="btnReset">Reset my progress</button>
    </div>
    <p class="keys">Shortcuts: <kbd>Space</kbd> flip · <kbd>1</kbd> Again · <kbd>2</kbd> Hard · <kbd>3</kbd> Got it</p>
  </section>

  <section id="vStudy" hidden>
    <div class="topbar">
      <button type="button" class="btn ghost sm" id="btnQuit">← Decks</button>
      <div class="prog"><div class="bar"><i id="pBar"></i></div><span class="ptxt" id="pTxt"></span></div>
    </div>
    <div class="stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press Space to flip.">
        <div class="inner"><div class="face front" id="front"></div><div class="face back" id="back" aria-live="polite"></div></div>
      </div>
    </div>
    <div class="rate">
      <button type="button" class="rb r1" data-r="1" disabled><span>Again</span><small>see it soon</small><kbd>1</kbd></button>
      <button type="button" class="rb r2" data-r="2" disabled><span>Hard</span><small>see it later</small><kbd>2</kbd></button>
      <button type="button" class="rb r3" data-r="3" disabled><span>Got it</span><small>done for now</small><kbd>3</kbd></button>
    </div>
    <p class="hint" id="hint">Tap the card or press Space to flip it.</p>
  </section>

  <section id="vDone" hidden><div class="done" id="doneBox"></div></section>
</div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const SUBD='₀₁₂₃₄₅₆₇₈₉',sub=n=>String(n).replace(/\d/g,d=>SUBD[d]);
const minus=v=>String(v).replace(/^-/,'−');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const B=(bits,o='')=>`<span class="bits">${[...bits].map((c,i)=>c===' '?'<i class="gap"></i>':`<i class="bt${c==='1'?' on':''}${o.includes('s')&&i===0?' sg':''}">${c}</i>`).join('')}</span>`;
const CALC=(...l)=>`<pre class="calc">${l.join('\n')}</pre>`;
const ROWS=(...pairs)=>`<div class="rows">${pairs.map(([l,b])=>`<span>${l}</span>${b}`).join('')}</div>`;
const toBits=(x,n)=>{const m=2**n;return (((x%m)+m)%m).toString(2).padStart(n,'0');};

/* ---------- Decks and cards ---------- */
const DECKS=[{k:'b',n:'Number systems'},{k:'c',n:'Conversions'},{k:'g',n:'Bin · Oct · Hex'},{k:'k',n:'Binary codes'},{k:'s',n:'Signed numbers'},{k:'a',n:'Arithmetic & overflow'}];
const DRILL={k:'z',n:'Practice drill'};
const CARDS=[
 {id:'b1',d:'b',q:'What does the <em>radix</em> (base) of a number system tell you?',a:'How many distinct digits it uses.',x:'In base r the digits run from 0 to r − 1, and a digit d in position k is worth d × rᵏ.'},
 {id:'b2',d:'b',q:'Which digits does hexadecimal use, and what is each letter worth?',a:'0–9 and A–F',x:'A = 10, B = 11, C = 12, D = 13, E = 14, F = 15. One hex digit covers exactly 4 bits.'},
 {id:'b3',d:'b',q:'What is the weight of the most significant bit of an 8-bit unsigned number?',v:B('10000000'),a:'2⁷ = 128',x:'Bit positions are numbered 0 to 7 from the right, so the MSB sits in position 7.',ans:{v:128,base:10}},
 {id:'b4',d:'b',q:'What is the largest unsigned value that fits in <em>n</em> bits?',a:'2ⁿ − 1',x:'All n bits set to 1. For 8 bits, 11111111₂ = 255; for 16 bits, 65 535.'},
 {id:'b5',d:'b',q:'How many bits do you need to store 1000₁₀ as an unsigned number?',a:'10 bits',x:'2⁹ = 512 ≤ 1000 < 1024 = 2¹⁰. In general n = ⌈log₂(N + 1)⌉.',ans:{v:10,base:10}},
 {id:'b6',d:'b',q:'In any base <em>r</em>, what is the value of the numeral 10ᵣ?',a:'r itself',x:'“10” means one r plus zero units: 10₂ = 2, 10₈ = 8, 10₁₆ = 16.'},
 {id:'b7',d:'b',q:'Why can 0.1₁₀ not be stored exactly in binary?',a:'Its binary expansion never ends: 0.000110011…₂',x:'A fraction terminates in base 2 only when its denominator, in lowest terms, is a power of 2. One tenth has a factor of 5.'},
 {id:'b8',d:'b',q:'How many bits are in a nibble, and in a byte?',a:'Nibble = 4 bits, byte = 8 bits',x:'A byte is two nibbles, which is why every byte is written as exactly two hex digits, 00 to FF.'},
 {id:'b9',d:'b',q:'Which digits are allowed in octal? Is 1829₈ a valid number?',a:'0–7, so 1829₈ is not valid.',x:'The digits 8 and 9 do not exist in base 8.'},

 {id:'c1',d:'c',q:'How do you convert a decimal <em>integer</em> to base r?',a:'Divide repeatedly by r and collect the remainders.',x:'Stop when the quotient reaches 0. The first remainder is the least significant digit, so read the remainders from the bottom up.'},
 {id:'c2',d:'c',q:'How do you convert a decimal <em>fraction</em> to base r?',a:'Multiply the fraction repeatedly by r and collect the integer parts.',x:'The first integer part is the first digit after the point, so read top to bottom. Stop when the fraction reaches 0 or you have enough digits.'},
 {id:'c3',d:'c',q:'Convert 156₁₀ to binary.',a:'10011100₂',vb:B('10011100'),x:'128 + 16 + 8 + 4 = 156.',ans:{v:156,base:2}},
 {id:'c4',d:'c',q:'Convert 0.375₁₀ to binary.',a:'0.011₂',vb:CALC('0.375 × 2 = 0.75  → 0','0.75  × 2 = 1.5   → 1','0.5   × 2 = 1.0   → 1'),x:'Read the integer parts from top to bottom. The fraction reached 0, so the result is exact.',ans:{v:0.375,base:2}},
 {id:'c5',d:'c',q:'Convert 2F7.A₁₆ to decimal.',a:'759.625',x:'2×256 + 15×16 + 7×1 + 10×(1/16) = 512 + 240 + 7 + 0.625.',ans:{v:759.625,base:10}},
 {id:'c6',d:'c',q:'Convert 1101.101₂ to decimal.',a:'13.625',x:'8 + 4 + 1 = 13 for the integer part, and 0.5 + 0.125 = 0.625 for the fraction.',ans:{v:13.625,base:10}},
 {id:'c7',d:'c',q:'Convert 157₈ to decimal.',a:'111',x:'1×64 + 5×8 + 7×1 = 111.',ans:{v:111,base:10}},
 {id:'c8',d:'c',q:'Convert 255₁₀ to hexadecimal.',a:'FF₁₆',x:'255 ÷ 16 = 15 remainder 15 (F), then 15 ÷ 16 = 0 remainder 15 (F).',ans:{v:255,base:16}},
 {id:'c9',d:'c',q:'Convert 100₁₀ to octal.',a:'144₈',vb:CALC('100 ÷ 8 = 12  r 4','12  ÷ 8 = 1   r 4','1   ÷ 8 = 0   r 1   ↑ read up'),x:'Check: 1×64 + 4×8 + 4 = 100.',ans:{v:100,base:8}},
 {id:'c10',d:'c',q:'Convert 45₁₀ to base 3.',a:'1200₃',vb:CALC('45 ÷ 3 = 15  r 0','15 ÷ 3 = 5   r 0','5  ÷ 3 = 1   r 2','1  ÷ 3 = 0   r 1   ↑ read up'),x:'Check: 1×27 + 2×9 + 0×3 + 0 = 45.',ans:{v:45,base:3}},

 {id:'g1',d:'g',q:'Why does one octal digit match exactly 3 bits, and one hex digit exactly 4?',a:'Because 8 = 2³ and 16 = 2⁴.',x:'A group of 3 bits has exactly 8 values and a group of 4 bits exactly 16, so the conversion is a direct swap of digit for group.'},
 {id:'g2',d:'g',q:'When grouping bits for octal or hex, where do you start, and where do you pad?',a:'Start at the radix point and work outward.',x:'Group the integer part right to left and pad zeros on the left. Group the fraction left to right and pad zeros on the right.'},
 {id:'g3',d:'g',q:'Convert 1011010111.011₂ to hexadecimal.',a:'2D7.6₁₆',vb:`${B('0010 1101 0111')} <b>.</b> ${B('0110')}`,x:'0010 = 2, 1101 = D, 0111 = 7, and the fraction 0110 = 6.',ans:{v:727.375,base:16}},
 {id:'g4',d:'g',q:'Convert 1011010111.011₂ to octal.',a:'1327.3₈',vb:`${B('001 011 010 111')} <b>.</b> ${B('011')}`,x:'Groups of three: 001 011 010 111 . 011 → 1 3 2 7 . 3.',ans:{v:727.375,base:8}},
 {id:'g5',d:'g',q:'Convert 3AF₁₆ to binary.',a:'1110101111₂',vb:B('0011 1010 1111'),x:'3 = 0011, A = 1010, F = 1111. Drop the leading zeros.',ans:{v:943,base:2}},
 {id:'g6',d:'g',q:'Convert 725₈ to hexadecimal.',a:'1D5₁₆',x:'Go through binary: 725₈ = 111 010 101₂. Regroup in fours: 0001 1101 0101 → 1 D 5.',ans:{v:469,base:16}},
 {id:'g7',d:'g',q:'Write 7F₁₆ in binary and in decimal.',a:'0111 1111₂ = 127',vb:B('0111 1111'),x:'7 = 0111 and F = 1111. 127 is the largest positive 8-bit 2’s complement number.'},

const BYID=Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ---------- Practice drill generator ---------- */
function drill(i){
  const id='z'+i+'_'+Math.random().toString(36).slice(2,6),t=ri(0,7);
  const wsum=n=>{const w=[];for(let k=12;k>=0;k--)if((n>>k)&1)w.push(2**k);return w.join(' + ');};
  if(t===0){const n=ri(9,255),b=n.toString(2);return {id,d:'z',q:`Convert ${n}${sub(10)} to binary.`,a:`${b}${sub(2)}`,vb:B(b),x:`${wsum(n)} = ${n}.`,ans:{v:n,base:2}};}
  if(t===1){const n=ri(9,255),b=n.toString(2);return {id,d:'z',q:`Convert ${b}${sub(2)} to decimal.`,v:B(b),a:String(n),x:`${wsum(n)} = ${n}.`,ans:{v:n,base:10}};}
  if(t===2){const n=ri(64,4095),b=n.toString(2),pad=b.padStart(Math.ceil(b.length/4)*4,'0'),g=pad.match(/.{4}/g),h=n.toString(16).toUpperCase();
    return {id,d:'z',q:`Convert ${b}${sub(2)} to hexadecimal.`,a:`${h}${sub(16)}`,vb:B(g.join(' ')),x:`${g.join(' ')} → ${[...h].join(' ')}.`,ans:{v:n,base:16}};}
  if(t===3){const n=ri(30,4095),h=n.toString(16).toUpperCase(),L=h.length;const terms=[...h].map((c,k)=>`${parseInt(c,16)}×${16**(L-1-k)}`);
    return {id,d:'z',q:`Convert ${h}${sub(16)} to decimal.`,a:String(n),x:`${terms.join(' + ')} = ${n}.`,ans:{v:n,base:10}};}
  if(t===4){const n=ri(20,511),o=n.toString(8);return {id,d:'z',q:`Convert ${n}${sub(10)} to octal.`,a:`${o}${sub(8)}`,x:`Divide by 8 repeatedly and read the remainders upward. Check: ${[...o].map((c,k)=>`${c}×${8**(o.length-1-k)}`).join(' + ')} = ${n}.`,ans:{v:n,base:8}};}
  if(t===5){const m=ri(1,127),mag=toBits(m,8),iv=mag.replace(/[01]/g,c=>c==='0'?'1':'0'),code=toBits(-m,8);
    return {id,d:'z',q:`Write −${m} in 8-bit 2’s complement.`,a:code,vb:B(code,'s'),x:`${m} = ${mag} → invert: ${iv} → add 1: ${code}.`,ans:{v:parseInt(code,2),base:2,bits:8}};}
  if(t===6){const p='1'+toBits(ri(0,127),7),rest=parseInt(p.slice(1),2),v=rest-128;
    return {id,d:'z',q:`What value does the 8-bit 2’s complement pattern ${p} represent?`,v:B(p,'s'),a:minus(v),x:`The MSB weighs −128: −128 + ${rest} = ${minus(v)}.`,ans:{v,base:10}};}
  let A=ri(-8,7),Bv=ri(-8,7);const s=A+Bv,code=toBits(s,4),dec=parseInt(code,2)-(code[0]==='1'?16:0),ovf=s<-8||s>7;
  return {id,d:'z',q:`In 4-bit 2’s complement, compute ${minus(A)} + ${minus(Bv)}. Does it overflow?`,a:`${code}${ovf?', overflow':', no overflow'}`,
    vb:CALC(`   ${toBits(A,4)}   (${minus(A)})`,`+  ${toBits(Bv,4)}   (${minus(Bv)})`,'-------',`   ${code}   reads as ${minus(dec)}`),
    x:ovf?`The true sum ${minus(s)} is outside −8 … +7, so the bits wrap around. V = 1.`:`The true sum ${minus(s)} fits in −8 … +7, so the result is correct.`};
}

/* ---------- SCORM 1.2 ---------- */
const SC={api:null,ok:false,t0:Date.now(),
  find(w){let n=0;try{while(w&&!w.API&&w.parent&&w.parent!==w&&n<12){w=w.parent;n++;}return w&&w.API?w.API:null;}catch(e){return null;}},
  init(){let api=this.find(window);if(!api){try{if(window.opener)api=this.find(window.opener);}catch(e){}}
    if(!api)return;this.api=api;try{const r=api.LMSInitialize('');this.ok=r===true||r==='true';}catch(e){this.ok=false;}
    if(this.ok){const st=this.get('cmi.core.lesson_status');if(!st||st==='not attempted')this.set('cmi.core.lesson_status','incomplete');this.commit();}},
  get(k){if(!this.ok)return '';try{return String(this.api.LMSGetValue(k)||'');}catch(e){return '';}},
  set(k,v){if(!this.ok)return;try{this.api.LMSSetValue(k,String(v));}catch(e){}},
  commit(){if(!this.ok)return;try{this.api.LMSCommit('');}catch(e){}},
  time(){const s=Math.round((Date.now()-this.t0)/1000),p=n=>String(n).padStart(2,'0');return `${String(Math.floor(s/3600)).padStart(4,'0')}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;},
  finish(){if(!this.ok||this.done)return;this.done=true;this.set('cmi.core.session_time',this.time());this.commit();try{this.api.LMSFinish('');}catch(e){}}
};
SC.init();
if(SC.ok){$('#lmsPill').classList.add('on');$('#lmsPill span').textContent='Connected to Moodle · progress saved';}
else $('#lmsPill span').textContent='Standalone · progress saved in this browser';
const nm=SC.get('cmi.core.student_name');
if(nm){const first=(nm.split(',')[1]||nm).trim().split(' ')[0];$('#greet').textContent=`Welcome back, ${first}. Pick one or more decks below.`;}
else $('#greet').textContent='Pick one or more decks below. Each card is one LED: it lights up as you master it.';

/* ---------- Persistence ---------- */
const KEY='radix-flashcards-v1';
let P={b:{},s:null};
function loadP(){let raw=SC.ok?SC.get('cmi.suspend_data'):'';if(!raw){try{raw=localStorage.getItem(KEY)||'';}catch(e){}}
  try{const o=JSON.parse(raw);if(o&&o.v===1){CARDS.forEach((c,i)=>{const d=+(o.b||'')[i];if(d)P.b[c.id]=d;});P.s=o.s||null;}}catch(e){}}
let commitT;
function saveP(now){const raw=JSON.stringify({v:1,b:CARDS.map(c=>P.b[c.id]||0).join(''),s:P.s});
  if(SC.ok){SC.set('cmi.suspend_data',raw);clearTimeout(commitT);if(now)SC.commit();else commitT=setTimeout(()=>SC.commit(),1500);}
  try{localStorage.setItem(KEY,raw);}catch(e){}}
loadP();

/* ---------- Setup view ---------- */
const sel=new Set(DECKS.map(d=>d.k));
function drawDecks(){
  $('#deckList').innerHTML=DECKS.map(d=>{const cs=CARDS.filter(c=>c.d===d.k),strong=cs.filter(c=>P.b[c.id]===3).length;
    return `<label class="deck"><input type="checkbox" data-k="${d.k}"${sel.has(d.k)?' checked':''}><span class="tile"><span class="tile-h"><span class="tick">✓</span><span class="tile-n">${d.n}</span><span class="tile-c">${cs.length} cards</span></span><span class="strip">${cs.map(c=>`<i class="b${P.b[c.id]||0}"></i>`).join('')}</span><span class="tile-s">${strong} of ${cs.length} mastered</span></span></label>`;}).join('');
  $('#btnResume').hidden=!(P.s&&P.s.q&&P.s.q.length);
  $('#btnStart').disabled=sel.size===0&&!$('#optDrill').checked;
}
$('#deckList').addEventListener('change',e=>{const i=e.target.closest('input');if(!i)return;i.checked?sel.add(i.dataset.k):sel.delete(i.dataset.k);drawDecks();});
$('#optDrill').addEventListener('change',drawDecks);
let resetArm=0;
$('#btnReset').addEventListener('click',e=>{const b=e.currentTarget;
  if(Date.now()-resetArm<4000){P={b:{},s:null};saveP(true);b.textContent='Progress erased';b.classList.remove('warn');resetArm=0;drawDecks();setTimeout(()=>b.textContent='Reset my progress',1800);return;}
  resetArm=Date.now();b.textContent='Tap again to erase all progress';b.classList.add('warn');
  setTimeout(()=>{if(resetArm&&Date.now()-resetArm>=3900){b.textContent='Reset my progress';b.classList.remove('warn');resetArm=0;}},4000);});

/* ---------- Study session ---------- */
let S=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function cardOf(id){return BYID[id]||(S&&S.drills[id]);}
function startSession(ids,opts){
  S={q:ids.slice(),total:ids.length,m:new Set(),first:{},again:new Set(),drills:opts.drills||{},type:opts.type,t0:Date.now(),flipped:false,checked:null,decks:opts.decks};
  persistSession();show('vStudy');next();
}
function buildIds(){
  let ids=CARDS.filter(c=>sel.has(c.d)).map(c=>c.id);const order=$('#optOrder').value;
  if(order==='shuffle')shuffle(ids);
  else if(order==='weak'){shuffle(ids);const rank=id=>{const b=P.b[id]||0;return b===1?0:b===0?1:b===2?2:3;};ids.sort((x,y)=>rank(x)-rank(y));}
  const drills={};
  if($('#optDrill').checked){for(let i=0;i<8;i++){const d=drill(i);drills[d.id]=d;}
    const dz=Object.keys(drills);
    if(order==='deck')ids=ids.concat(dz);else dz.forEach(id=>ids.splice(ri(0,ids.length),0,id));}
  return {ids,drills};
}
$('#btnStart').addEventListener('click',()=>{const {ids,drills}=buildIds();if(!ids.length)return;startSession(ids,{drills,type:$('#optType').checked,decks:[...sel]});});
$('#btnResume').addEventListener('click',()=>{const s=P.s;const q=s.q.filter(id=>BYID[id]);if(!q.length){P.s=null;saveP(true);drawDecks();return;}
  S={q,total:s.n||q.length,m:new Set((s.m||[]).filter(id=>BYID[id])),first:{},again:new Set(),drills:{},type:!!s.t,t0:Date.now(),flipped:false,checked:null,decks:s.d||[]};
  Object.entries(s.f||{}).forEach(([k,v])=>{if(BYID[k])S.first[k]=v/2;});
  S.total=Math.max(S.total,S.q.length+S.m.size);
  show('vStudy');next();});
function persistSession(){if(!S){P.s=null;saveP();return;}
  const f={};Object.entries(S.first).forEach(([k,v])=>{if(BYID[k])f[k]=Math.round(v*2);});
  const fixedTotal=S.q.filter(id=>BYID[id]).length+[...S.m].filter(id=>BYID[id]).length;
  P.s={q:S.q.filter(id=>BYID[id]),m:[...S.m].filter(id=>BYID[id]),f,t:S.type?1:0,n:fixedTotal,d:S.decks};saveP();}

function show(v){['vSetup','vStudy','vDone'].forEach(x=>$('#'+x).hidden=x!==v);if(v==='vSetup')drawDecks();window.scrollTo(0,0);}

function next(){
  if(!S.q.length){finishSession();return;}
  const id=S.q[0],c=cardOf(id),deck=c.d==='z'?DRILL.n:DECKS.find(d=>d.k===c.d).n;
  const card=$('#card');card.classList.add('instant');card.classList.remove('flipped');S.flipped=false;S.checked=null;
  const typing=S.type&&c.ans;
  $('#front').innerHTML=`<div class="fhead"><span class="tag">${deck}</span><span class="num">${S.m.size+1} / ${S.total}</span></div><div class="q">${c.q}</div>${c.v?`<div class="vis">${c.v}</div>`:''}${typing?`<form class="typ" id="typ"><input id="tIn" type="text" autocomplete="off" spellcheck="false" aria-label="Your answer" placeholder="Your answer${c.ans.base!==10?` (base ${c.ans.base})`:''}"><button class="btn sm" type="submit">Check</button></form>`:''}<div class="cue">${typing?'Type your answer, or tap the card to reveal':'Tap to reveal ↻'}</div>`;
  $('#back').innerHTML='';
  void card.offsetWidth;card.classList.remove('instant');
  card.classList.remove('enter');void card.offsetWidth;card.classList.add('enter');
  $$('.rb').forEach(b=>{b.disabled=true;b.classList.remove('suggest');});
  $('#hint').textContent=typing?'Press Enter to check your answer.':'Tap the card or press Space to flip it.';
  const pct=S.total?S.m.size/S.total*100:0;$('#pBar').style.width=pct+'%';
  const rep=S.q.filter(x=>S.again.has(x)).length;
  $('#pTxt').textContent=`${S.m.size} of ${S.total} done · ${S.q.length} in the stack${rep?` · ${rep} to repeat`:''}`;
  if(typing){const f=$('#typ');f.addEventListener('submit',e=>{e.preventDefault();checkTyped(c);});setTimeout(()=>{try{$('#tIn').focus({preventScroll:true});}catch(e){}},60);}
  else card.focus({preventScroll:true});
}
function parseAns(s,base){
  const DIG='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  s=s.trim().toUpperCase().replace(/[\s_₀-₉]/g,'').replace(/^−/,'-');
  if(base===2)s=s.replace(/^0B/,'');if(base===16)s=s.replace(/^0X/,'');if(base===8)s=s.replace(/^0O/,'');
  let neg=false;if(s[0]==='-'){neg=true;s=s.slice(1);}
  if(!s||!/^[0-9A-Z]*\.?[0-9A-Z]*$/.test(s))return null;
  const [ip,fp='']=s.split('.');let v=0,w=1/base;
  for(const ch of ip){const d=DIG.indexOf(ch);if(d<0||d>=base)return null;v=v*base+d;}
  for(const ch of fp){const d=DIG.indexOf(ch);if(d<0||d>=base)return null;v+=d*w;w/=base;}
  return {v:neg?-v:v,len:(ip+fp).length};
}
function checkTyped(c){
  const raw=$('#tIn').value;if(!raw.trim()){$('#tIn').focus();return;}
  const p=parseAns(raw,c.ans.base);
  const ok=!!p&&Math.abs(p.v-c.ans.v)<1e-9&&(!c.ans.bits||p.len===c.ans.bits);
  S.checked={ok,raw:raw.trim(),valueOk:!!p&&Math.abs(p.v-c.ans.v)<1e-9};flip(true);
}
function flip(force){
  if(!S||!S.q.length)return;
  if(S.flipped&&!force){$('#card').classList.toggle('flipped');return;}
  if(S.flipped)return;
  const c=cardOf(S.q[0]);
  let verdict='';
  if(S.checked){const ck=S.checked;verdict=`<span class="verdict ${ck.ok?'ok':'no'}">${ck.ok?'✓ Your answer is right':(ck.valueOk&&c.ans.bits?`Give all ${c.ans.bits} bits`:'✗ You wrote '+ck.raw.replace(/[<>&]/g,''))}</span>`;}
  $('#back').innerHTML=`<div class="fhead"><span class="tag ans">Answer</span>${verdict}</div><div class="a">${c.a}</div>${c.vb?`<div class="vis">${c.vb}</div>`:''}${c.x?`<p class="x">${c.x}</p>`:''}<div class="cue">Rate how well you knew it ↓</div>`;
  $('#card').classList.add('flipped');S.flipped=true;
  $$('.rb').forEach(b=>b.disabled=false);
  if(S.checked)$(`.rb[data-r="${S.checked.ok?3:1}"]`).classList.add('suggest');
  $('#hint').textContent='How well did you know it? Press 1, 2 or 3.';
  $('#card').focus({preventScroll:true});
}
function rate(r){
  if(!S||!S.flipped)return;
  const id=S.q.shift();
  if(!(id in S.first))S.first[id]=r===3?1:r===2?0.5:0;
  if(BYID[id])P.b[id]=r;
  if(r===1){S.again.add(id);S.q.splice(Math.min(2,S.q.length),0,id);}
  else if(r===2){S.q.splice(Math.min(S.q.length,ri(4,7)),0,id);}
  else S.m.add(id);
  persistSession();next();
}
function finishSession(){
  const ids=Object.keys(S.first),total=S.total||ids.length;
  const got=ids.reduce((a,k)=>a+S.first[k],0),score=total?Math.round(got/total*100):0;
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  const missed=ids.filter(k=>S.first[k]<1);
  P.s=null;saveP(true);
  if(SC.ok){SC.set('cmi.core.score.min','0');SC.set('cmi.core.score.max','100');SC.set('cmi.core.score.raw',score);SC.set('cmi.core.lesson_status','completed');SC.set('cmi.core.exit','');SC.commit();}
  const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent;};
  const missedFixed=missed.filter(k=>BYID[k]);
  $('#doneBox').innerHTML=`<p class="eyebrow">Session complete</p><p class="big">${score}%<small>first-try recall</small></p><p class="sumtxt">${Math.round(got*2)/2} of ${total} cards recalled on the first try, in about ${mins} minute${mins>1?'s':''}.${SC.ok?' Your score has been sent to Moodle.':''}</p>`+
    (missed.length?`<h3>Worth another look</h3><ul class="miss">${missed.map(k=>{const c=cardOf(k);return `<li><b>${c.d==='z'?DRILL.n:DECKS.find(d=>d.k===c.d).n}</b>${plain(c.q)}</li>`;}).join('')}</ul>`:'<p>You recalled every card on the first try.</p>')+
    `<div class="row">${missedFixed.length?`<button type="button" class="btn" id="btnMiss">Review these ${missedFixed.length} again</button>`:''}<button type="button" class="btn ${missedFixed.length?'ghost':''}" id="btnAgain">Choose decks</button></div>`;
  S=null;show('vDone');
  const bm=$('#btnMiss');if(bm)bm.addEventListener('click',()=>startSession(shuffle(missedFixed.slice()),{drills:{},type:$('#optType').checked,decks:[]}));
  $('#btnAgain').addEventListener('click',()=>show('vSetup'));
}
$('#card').addEventListener('click',e=>{if(e.target.closest('.typ'))return;flip();});
$$('.rb').forEach(b=>b.addEventListener('click',()=>rate(+b.dataset.r)));
$('#btnQuit').addEventListener('click',()=>{persistSession();S=null;show('vSetup');});
document.addEventListener('keydown',e=>{
  if($('#vStudy').hidden||!S)return;
  const tg=e.target;if(tg.closest&&(tg.closest('input,select,textarea')||(tg.closest('button')&&!tg.closest('#card'))))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(['1','2','3'].includes(e.key)&&S.flipped){e.preventDefault();rate(+e.key);}
});
const bye=()=>{if(S)persistSession();saveP(true);if(SC.ok&&!SC.done){SC.set('cmi.core.exit',P.s?'suspend':'');SC.finish();}};
window.addEventListener('pagehide',bye);window.addEventListener('beforeunload',bye);
show('vSetup');
})();
</script>
